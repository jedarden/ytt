---
# ExternalSecret — pulls ytt credentials from OpenBao via ESO.
# Paths: ardenone-cluster/ytt/* (plan §Security: "Secrets via ESO/OpenBao").
# The resulting Secret ("ytt-secrets") is mounted as env vars in the Deployment.
# Keys written to OpenBao (human step — see DEPLOY-CHECKLIST.md §1):
#   ardenone-cluster/ytt/oauth-client-secret  → OAuth client secret (AS token signing)
#   ardenone-cluster/ytt/oauth-client-id      → OAuth client id (static "claudeai")
#   ardenone-cluster/ytt/allowed-subjects     → comma-separated subject allowlist
#   ardenone-cluster/ytt/proxy-url            → optional Webshare proxy URL (may be empty)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ytt-secrets
  namespace: ytt
  labels:
    app.kubernetes.io/name: ytt
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-cluster-store    # ClusterSecretStore — ardenone-cluster norm
    kind: ClusterSecretStore
  target:
    name: ytt-secrets
    creationPolicy: Owner
  data:
    - secretKey: oauth_client_secret
      remoteRef:
        key: ardenone-cluster/ytt/oauth-client-secret
        property: value
    - secretKey: oauth_client_id
      remoteRef:
        key: ardenone-cluster/ytt/oauth-client-id
        property: value
    - secretKey: allowed_subjects
      remoteRef:
        key: ardenone-cluster/ytt/allowed-subjects
        property: value
    - secretKey: proxy_url
      remoteRef:
        key: ardenone-cluster/ytt/proxy-url
        property: value
