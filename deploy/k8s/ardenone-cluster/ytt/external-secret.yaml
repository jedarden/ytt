---
# ExternalSecret — pulls ytt credentials from OpenBao via ESO.
# NOTE: this file is a reference copy in ytt's own repo -- the manifest
# ArgoCD actually syncs lives in declarative-config
# (k8s/ardenone-cluster/ytt/ytt-externalsecret.yml). Keep them in sync by
# hand; declarative-config is authoritative if they ever drift.
#
# OAuth (ADR-003, docs/plan/plan.md): federates to Authentik with ytt's own
# client, not shared with ibkr-mcp. OpenBao path: ardenone-cluster/ytt/oauth
# (keys client_id, client_secret) -- also read by Authentik's own blueprint
# (declarative-config authentik-oidc-clients-externalsecret.yml) so both
# sides agree.
#
# Keys written to OpenBao:
#   ardenone-cluster/ytt/oauth  { client_id, client_secret }  → Authentik OAuth2 client
#   ardenone-cluster/ytt/allowed-subjects     → comma-separated subject allowlist
#   ardenone-cluster/ytt/proxy-url            → optional Webshare proxy URL (may be empty)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ytt-secrets
  namespace: ytt
  labels:
    app.kubernetes.io/name: ytt
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-cluster-store    # ClusterSecretStore — ardenone-cluster norm
    kind: ClusterSecretStore
  target:
    name: ytt-secrets
    creationPolicy: Owner
  data:
    - secretKey: oauth_client_secret
      remoteRef:
        key: ardenone-cluster/ytt/oauth
        property: client_secret
    - secretKey: oauth_client_id
      remoteRef:
        key: ardenone-cluster/ytt/oauth
        property: client_id
    - secretKey: allowed_subjects
      remoteRef:
        key: ardenone-cluster/ytt/allowed-subjects
        property: value
    - secretKey: proxy_url
      remoteRef:
        key: ardenone-cluster/ytt/proxy-url
        property: value
