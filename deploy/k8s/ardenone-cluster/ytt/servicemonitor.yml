---
# ServiceMonitor for both ytt workloads (plan §Observability:
# "scraped via a ServiceMonitor — Prometheus-operator is present on the cluster").
#   - server (service/ytt):   /ytt/metrics on port http   (8080)
#   - canary (service/ytt-canary): /metrics on port metrics (8081, prometheus_client)
# Scraped on the ClusterIP, no auth (Prometheus in-cluster only).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ytt
  namespace: ytt
  labels:
    app.kubernetes.io/name: ytt
    app.kubernetes.io/component: monitoring
    # Label must match the Prometheus operator's serviceMonitorSelector.
    # ardenone-cluster convention — mirror ibkr-mcp's label.
    prometheus: kube-prometheus
spec:
  # Select both the server and the canary Service. Each endpoint names a port
  # only one Service has, so /ytt/metrics resolves against ytt and /metrics
  # against ytt-canary; unmatched endpoint/port pairs are skipped by the operator.
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [ytt, ytt-canary]
  endpoints:
    - port: http
      path: /ytt/metrics
      interval: 30s
      scrapeTimeout: 10s
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
