---
# ytt-browser — the browser server behind ytt's PRIMARY caption fetch
# (bead ytt-204947b5; design, measurements and failure contract:
# ytt repo docs/notes/browser-fetch.md).
#
# Why this exists: YouTube's caption endpoint returns an empty body / HTTP 429
# unless the request carries a PO token that YouTube's own player minted, and
# yt-dlp cannot mint one (31/36 known-bad videos still 429'd after a yt-dlp
# bump).  A stealth Chromium's player can, so ytt connects here over WebSocket
# and lets the player make the request itself.
#
# `playwright launch-server` with the stealth launch options FIXED HERE, on the
# server.  Not `run-server`: since Playwright 1.6x `run-server` silently drops
# client-supplied `args` / `ignoreDefaultArgs` (the options that stop the
# browser looking automated) unless started with `--unsafe`, which would let
# any pod on the cluster network set `executablePath` — arbitrary command
# execution in this pod.  Measured 2026-10-07: through `run-server` the browser
# came up HeadlessChrome / navigator.webdriver=true, YouTube rejected the
# player's PO token, and 39/39 browser fetches returned an empty body.  With
# the options set server-side, webdriver=false and the token is accepted.
#
# One shared browser; ytt opens a fresh CONTEXT per fetch and closes it.
# Measured: RSS plateaus (~860 MB after 25 full fetch cycles, ~1 MB/cycle
# drift), unlike the single long-lived CONTEXT that was OOM-killed at ~19
# pages.  A browser crash can still restart only this pod, never ytt, whose
# job registry is in-process.  The bash loop recycles the browser every 6 h to
# bound the slow drift (a fetch in flight at that moment falls back to yt-dlp).
#
# SECURITY: the server is UNAUTHENTICATED and can browse from the home IP.  It
# is ClusterIP-only with no IngressRoute and no tailscale exposure — never add
# either.  NetworkPolicy IS enforced on this cluster (k3s runs its embedded
# kube-router controller on every node; no --disable-network-policy), so egress
# policies must name this server (networkpolicy.yml has the ytt -> :3001 rule;
# its absence broke prod's first browser fetch, ytt-1e4c448b).  No policy yet
# restricts INGRESS to this pod, so any pod in the cluster can reach it: an
# ingress-only policy allowing app=ytt / app=ytt-caption-retest is the pending
# hardening step (test the kubelet readiness probe before applying it).
#
# Image: stock mcr.microsoft.com/playwright/python (browsers baked in at
# /ms-playwright).  It does NOT ship the playwright package itself, so it is
# pip-installed at start, pinned to the image's own version (the server and
# ytt's client wheel must share major.minor).  Startup therefore needs PyPI.
#
# PID 1 is bash supervising the server: Chromium leaves zombie helper
# processes unless PID 1 reaps them (measured: 12 zombies after three
# fetches with the server as PID 1, 0 with bash as PID 1).
#
# Deployment, not Job (Jobs are banned here); replicas 1 + Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytt-browser
  namespace: ytt
  labels:
    app: ytt-browser
    app.kubernetes.io/name: ytt
    app.kubernetes.io/component: browser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ytt-browser
  template:
    metadata:
      labels:
        app: ytt-browser
        app.kubernetes.io/name: ytt
        app.kubernetes.io/component: browser
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: browser
          image: mcr.microsoft.com/playwright/python:v1.63.0-noble
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip3 install --quiet playwright==1.63.0
              # Stealth launch options live HERE, not in the client (see header).
              # Full Chromium in new-headless mode, automation switches removed.
              # ytt connects to ws://ytt-browser.ytt.svc.cluster.local:3001/ytt
              cat > /tmp/launch.json <<'JSON'
              {
                "channel": "chromium",
                "headless": true,
                "ignoreDefaultArgs": ["--enable-automation"],
                "args": ["--no-sandbox", "--disable-dev-shm-usage",
                         "--disable-blink-features=AutomationControlled"],
                "host": "0.0.0.0",
                "port": 3001,
                "wsPath": "ytt"
              }
              JSON
              server=""
              # bash is PID 1: forward termination, and reap orphaned Chromium helpers.
              trap '[ -n "$server" ] && kill -TERM "$server" 2>/dev/null; wait 2>/dev/null; exit 0' TERM INT
              while true; do
                # 6 h recycle (timeout exits 124) and crash-restart in one loop.
                timeout 21600 python3 -m playwright launch-server --browser chromium --config /tmp/launch.json &
                server=$!
                wait "$server" || true
                sleep 1
              done
          ports:
            - name: ws
              containerPort: 3001
              protocol: TCP
          # Sizing: each in-flight fetch is its own Chromium (~400-700 MB
          # measured; docs/notes/browser-fetch.md).  ytt's
          # YTT_BROWSER_MAX_CONCURRENCY=3 → ~2 GiB peak.  Request is the
          # typical (one or two fetches); the limit is the 3-fetch peak.
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
              ephemeral-storage: "200Mi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Not the HTTP surface (it speaks WebSocket): a TCP accept is the
          # readiness signal.  Generous liveness delay: the pip install at
          # start takes tens of seconds and must not be killed mid-way.
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
