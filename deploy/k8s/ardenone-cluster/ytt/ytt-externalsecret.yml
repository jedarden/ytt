---
# Pulls ytt's own Authentik OAuth2 client credentials into a Kubernetes
# Secret (ADR-003, jedarden/ytt docs/plan/plan.md -- federates to the org's
# self-hosted Authentik, sso.ardenone.com, via a client that is ytt's own,
# not shared with ibkr-mcp the way the old Google setup was).
#
# authentik-oidc-clients-externalsecret.yml (../authentik/) reads this SAME
# OpenBao path to configure what Authentik EXPECTS ytt to present --
# both sides reading one OpenBao value is what keeps them from drifting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ytt-secrets
  namespace: ytt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-v2
    kind: ClusterSecretStore
  target:
    name: ytt-secrets
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: ardenone-cluster/ytt/oauth
        property: client_id
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: ardenone-cluster/ytt/oauth
        property: client_secret
