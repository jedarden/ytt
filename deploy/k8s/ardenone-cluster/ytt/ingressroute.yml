---
# Traefik IngressRoute for ytt (plan §Deployment: "IngressRoute on
# Host(mcp.ardenone.com) + PathPrefix(/ytt) and PathPrefix(/.well-known/oauth-*/ytt)").
#
# .well-known routing strategy (plan §Deployment / .well-known handling):
#   - ibkr has a broad rule: PathPrefix(`/.well-known`) at default priority (no explicit).
#   - ytt adds TWO more-specific rules for its own suffixes with priority: 1000
#     (plan: "ibkr has no explicit priority; Traefik auto-computes from rule string
#     length ~80 chars → ~80 priority. Use 1000 for a wide, stable margin.")
#   - Traefik routes only ytt's .well-known/{resource,as}/ytt to ytt.
#   - ibkr's broad /.well-known rule continues to serve ibkr's suffixes + bare-root.
#   - ibkr's manifests are NOT edited (additive interception — do-no-harm).
#
# Verification (plan §Deployment, step 2):
#   curl https://mcp.ardenone.com/.well-known/oauth-protected-resource/ytt
#   → {"resource": "https://mcp.ardenone.com/ytt", ...}
#   curl https://mcp.ardenone.com/.well-known/oauth-protected-resource/ibkr
#   → byte-for-byte unchanged from pre-ytt baseline
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ytt
  namespace: ytt
  labels:
    app.kubernetes.io/name: ytt
    app.kubernetes.io/component: ingress
  # No external-dns annotation: the mcp.ardenone.com record is already owned by
  # ibkr-mcp's IngressRoute (same Cloudflare tunnel). Declaring it here too would
  # create dueling external-dns ownership for an identical record.
spec:
  entryPoints:
    - websecure
    - vpn
  routes:
    # --- Main ytt path ---
    # All tool calls, /health, /metrics, /admin/egress, /mcp, and OIDC-appended
    # .well-known (/.well-known/openid-configuration under /ytt) land here.
    - match: Host(`mcp.ardenone.com`) && PathPrefix(`/ytt`)
      kind: Rule
      middlewares:
        - name: ytt-sse
          namespace: ytt
        - name: ytt-cors
          namespace: ytt
      services:
        - name: ytt
          port: 8080

    # --- Path-inserted .well-known/oauth-protected-resource/ytt ---
    # RFC 9728: PRM at the host root with the resource path appended.
    # Priority 1000 > ibkr's auto-computed ~80 → ytt handles only /ytt suffix.
    - match: Host(`mcp.ardenone.com`) && PathPrefix(`/.well-known/oauth-protected-resource/ytt`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: ytt-cors
          namespace: ytt
      services:
        - name: ytt
          port: 8080

    # --- Path-inserted .well-known/oauth-authorization-server/ytt ---
    # RFC 8414: AS metadata at host root + resource path.
    # Same priority strategy as above.
    - match: Host(`mcp.ardenone.com`) && PathPrefix(`/.well-known/oauth-authorization-server/ytt`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: ytt-cors
          namespace: ytt
      services:
        - name: ytt
          port: 8080

    # --- Path-inserted .well-known/openid-configuration/ytt ---
    # OIDC discovery path-insertion. MCP clients (Claude) probe this variant
    # in addition to oauth-authorization-server when discovering the AS for a
    # path-bearing issuer (https://mcp.ardenone.com/ytt). ytt's app registers
    # this exact route (ytt/auth.py get_routes → openid-configuration{issuer}
    # aliased to the AS-metadata handler), but WITHOUT this rule the request
    # falls through to ibkr's broad PathPrefix(`/.well-known`) rule and gets a
    # 401 whose WWW-Authenticate points at ibkr's resource metadata — derailing
    # the client onto the wrong authorization server ("no connection succeeded"
    # despite the ytt OAuth flow completing). Same priority: 1000 margin.
    - match: Host(`mcp.ardenone.com`) && PathPrefix(`/.well-known/openid-configuration/ytt`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: ytt-cors
          namespace: ytt
      services:
        - name: ytt
          port: 8080

  tls:
    secretName: mcp-ardenone-com-tls
