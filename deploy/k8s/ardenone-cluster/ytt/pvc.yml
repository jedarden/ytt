---
# Persistent volume claim for the transcript cache (plan: "PVC, longhorn, 2Gi").
# Storage class: longhorn (ardenone-cluster default; plan §Deployment notes).
# YTT_CACHE_BACKEND=pvc tells the app to use this volume at /cache.
# Invariant: YTT_CACHE_MAX_BYTES ≤ PVC capacity, validated at startup — but the
# app measures capacity via statvfs on the mounted fs, which reports less than
# the nominal request (ext4 reserved blocks knock ~2040373248 bytes usable out
# of a "2Gi" == 2147483648-byte request). Keep YTT_CACHE_MAX_BYTES comfortably
# below the requested size (deployment.yml uses 1800Mi) rather than matching it
# exactly, or the pod CrashLoopBackOffs on startup validation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ytt-cache
  namespace: ytt
  labels:
    app.kubernetes.io/name: ytt
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
