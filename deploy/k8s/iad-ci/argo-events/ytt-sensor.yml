apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  name: ytt-sensor
  namespace: argo-events
spec:
  template:
    # Prefer dependable nodes: the one gp.vs1.2xlarge-iad is dependable:false
    # and evicts Sensors under DiskPressure. Preferred, not required, so it
    # stays the fallback (declarat-f3fff8dc).
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
            - key: servers.ngpc.rxt.io/class
              operator: NotIn
              values:
              - gp.vs1.2xlarge-iad
    metadata:
      annotations:
        kubectl.kubernetes.io/restarted-at: '2026-08-07T07:53:59Z'
    container:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
  eventBusName: default
  fetchTimeout: 3s
  dependencies:
  - name: ytt-push
    eventSourceName: github-webhooks
    eventName: ytt
    filters:
      data:
      - path: headers.X-Github-Event
        type: string
        value:
        - push
      - path: body.ref
        type: string
        value:
        - refs/heads/main
      - path: body.head_commit.message
        type: string
        comparator: '!='
        value:
        - '^ci: auto-bump'
  triggers:
  - template:
      name: ytt-build
      argoWorkflow:
        operation: submit
        # Pin the build to the pushed commit. body.after is the pushed SHA;
        # index 2 is `revision` in the resource's arguments below. Without
        # this the workflow's `revision` keeps its non-SHA sentinel and
        # resolve-version rejects the run loudly (rather than building
        # whatever refs/heads/main points at when a pod starts, which is
        # how a sibling push could slip commits into a release tag). Same
        # wiring as armor-sensor.yml (armor-8c4d068d).
        parameters:
        - src:
            dependencyName: ytt-push
            dataKey: body.after
          dest: spec.arguments.parameters.2.value
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: ytt-build-
              namespace: argo-workflows
            spec:
              serviceAccountName: argo-workflow
              workflowTemplateRef:
                name: ytt-build
              arguments:
                parameters:
                - name: git-repo
                  value: jedarden/ytt
                - name: branch
                  value: main
                - name: revision
                  value: unset
    conditions: ytt-push
